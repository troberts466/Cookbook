<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karis Recipe Book</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recipes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Personal cookbook</p>
        <h1>Karis Recipe Book</h1>
        <p class="subtitle">Save recipes from TikTok, YouTube, websites, or family notes.</p>
      </div>
      <button id="installBtn" class="install-btn hidden">Install App</button>
    </header>

    <section class="controls card">
      <input id="searchInput" type="search" placeholder="Search recipes, ingredients, categories..." />
      <div class="filter-row">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="favorites">Favorites</button>
        <button class="chip" data-filter="dinner">Dinner</button>
        <button class="chip" data-filter="dessert">Dessert</button>
        <button class="chip" data-filter="breakfast">Breakfast</button>
      </div>
    </section>

    <main class="grid-layout">
      <section class="card form-card">
        <div class="section-title">
          <h2>Add Recipe</h2>
          <p>Manual entry for version 1. AI import can come later.</p>
        </div>

        <form id="recipeForm">
          <label>Recipe name
            <input id="name" required placeholder="Creamy garlic chicken" />
          </label>

          <label>Category
            <select id="category">
              <option>Dinner</option>
              <option>Breakfast</option>
              <option>Lunch</option>
              <option>Dessert</option>
              <option>Snack</option>
              <option>Slow Cooker</option>
              <option>Holiday</option>
              <option>Other</option>
            </select>
          </label>

          <label>Source URL
            <input id="url" type="url" placeholder="Paste TikTok, YouTube, Instagram, or website link" />
          </label>

          <label>Ingredients <span>one per line</span>
            <textarea id="ingredients" rows="6" placeholder="2 chicken breasts\n1 cup heavy cream\n4 cloves garlic"></textarea>
          </label>

          <label>Instructions <span>one step per line</span>
            <textarea id="instructions" rows="6" placeholder="Season chicken\nSear in skillet\nAdd cream and garlic\nSimmer 15 minutes"></textarea>
          </label>

          <label>Notes
            <textarea id="notes" rows="3" placeholder="Family tweaks, serving ideas, substitutions..."></textarea>
          </label>

          <button class="primary-btn" type="submit">Save Recipe</button>
        </form>
      </section>

      <section class="recipes-area">
        <div class="section-title list-title">
          <div>
            <h2>Saved Recipes</h2>
            <p id="recipeCount">0 recipes</p>
          </div>
          <button id="clearSampleBtn" class="ghost-btn">Clear sample</button>
        </div>
        <div id="recipeList" class="recipe-list"></div>
      </section>
    </main>
  </div>

  <template id="recipeCardTemplate">
    <article class="recipe-card card">
      <div class="recipe-top">
        <div>
          <p class="category-pill"></p>
          <h3></h3>
        </div>
        <button class="favorite-button" title="Toggle favorite">☆</button>
      </div>
      <a class="source-link" target="_blank" rel="noopener">Open source</a>
      <div class="recipe-section ingredients-section">
        <h4>Ingredients</h4>
        <ul></ul>
      </div>
      <div class="recipe-section instructions-section">
        <h4>Instructions</h4>
        <ol></ol>
      </div>
      <p class="notes"></p>
      <div class="card-actions">
        <button class="copy-btn">Copy</button>
        <button class="delete-btn">Delete</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
